<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Círculo negro con borde amarillo brillante -->
  <circle cx="256" cy="256" r="240" fill="#000000" stroke="#FFD700" stroke-width="16"/>
  
  <!-- Sombra del borde para efecto brillante -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#FFA500" stroke-width="8" opacity="0.6"/>
  
  <!-- Manzana blanca (silueta estilo Apple) -->
  <g transform="translate(256, 256) scale(1.2)">
    <!-- Cuerpo de la manzana -->
    <path d="M 0,-80 
             C -40,-80 -70,-50 -70,-10
             C -70,30 -50,70 -30,90
             C -15,105 -5,110 0,110
             C 5,110 15,105 30,90
             C 50,70 70,30 70,-10
             C 70,-50 40,-80 0,-80 Z" 
          fill="#FFFFFF"/>
    
    <!-- Mordida -->
    <circle cx="55" cy="-10" r="25" fill="#000000"/>
    
    <!-- Hoja -->
    <path d="M 0,-80 
             C 5,-95 15,-105 30,-110
             C 25,-95 15,-85 0,-80 Z" 
          fill="#FFFFFF"/>
    
    <!-- Tallo -->
    <path d="M 0,-80 
             C 0,-90 2,-100 5,-105
             C 3,-100 1,-90 0,-80 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="3"/>
  </g>
</svg>
